                  {t.l}
                </button>
              ))}

                        <span className="text-2xl">{i % 2 === 0 ? '👩‍💼' : '👨‍💼'}</span>
                        <div>
                          <div className="font-bold text-white text-sm">{c.n}</div>
                          <div className="text-[10px] text-zinc-500">{c.s}</div>

                      </div>
                      <div className="grid grid-cols-2 gap-2 text-xs">

                        className="h-full flex items-center justify-center text-[10px] font-bold text-black hover:opacity-80 transition"
                      >
                        {pm.p >= 15 && `${pm.p}%`}
                      </div>
                    ))}
                  </div>
                  <div className="flex flex-wrap gap-4 text-xs">
                    {P.map((pm, i) => (
                      <div key={i} className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded" style={{ backgroundColor: pm.cl }}></span>
                        <span className="text-zinc-300">{pm.m} ({pm.p}%)</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {ac === 'branches' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                {B.map((b, i) => (
                  <div key={i} className={`bg-zinc-950 border rounded-2xl p-5 space-y-4 ${i === 0 ? 'border-[#c6f500]/50' : 'border-zinc-800'}`}>
                    <div className="flex items-start justify-between">
                      <div>
                        <div className="text-[10px] text-zinc-500 uppercase font-bold">Chi Nhánh #{i + 1}</div>
                        <div className="font-bold text-white text-sm mt-1">{b.b}</div>
                      </div>
                      {i === 0 && <span className="px-2 py-0.5 bg-[#c6f500]/15 text-[#c6f500] text-[10px] font-bold rounded">🏆</span>}
                    </div>
                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div className="bg-zinc-900 rounded-xl p-3 text-center">
                        <div className="text-zinc-500 text-[10px]">Doanh Thu</div>
                        <div className="font-black text-[#c6f500] text-lg">{(b.r / 1e6).toFixed(1)}M</div>
                      </div>
                      <div className="bg-zinc-900 rounded-xl p-3 text-center">
                        <div className="text-zinc-500 text-[10px]">Đơn</div>
                        <div className="font-black text-white text-lg">{b.o}</div>
                      </div>
                    </div>
                    <div className="text-xs text-zinc-400">SP chạy nhất: <b className="text-white">{b.t}</b></div>
                    <div className="w-full bg-zinc-900 rounded-full h-2 overflow-hidden">
                      <div style={{ width: `${(b.r / B[0].r) * 100}%` }} className="h-full bg-[#c6f500] rounded-full"></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {ac === 'transactions' && (
              <div className="bg-zinc-950 border border-zinc-800 rounded-3xl overflow-hidden">
                <table className="w-full text-xs text-left">
                  <thead className="bg-zinc-900 text-zinc-400 border-b border-zinc-800">
                    <tr>
                      <th className="p-3">Mã GD</th>
                      <th className="p-3">Giờ</th>
                      <th className="p-3">Thu Ngân</th>
                      <th className="p-3">Khách</th>
                      <th className="p-3">SP</th>
                      <th className="p-3 text-right">Tổng</th>
                      <th className="p-3">Thanh Toán</th>
                      <th className="p-3 text-center">Trạng Thái</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-800/60">
                    {TX.map((t, i) => (
                      <tr key={i} className="hover:bg-zinc-900/40 transition">
                        <td className="p-3 font-mono font-bold text-[#c6f500]">#{t.id}</td>
                        <td className="p-3 text-zinc-300">{t.t}</td>
                        <td className="p-3 text-zinc-300">{t.cs}</td>
                        <td className="p-3 font-bold text-white">{t.cu}</td>
                        <td className="p-3 text-zinc-300">{t.it}</td>
                        <td className="p-3 text-right font-black text-white">{f(t.to)}₫</td>
                        <td className="p-3 text-zinc-300">{t.pa}</td>
                        <td className="p-3 text-center">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            t.st === 'done' ? 'bg-[#c6f500]/15 text-[#c6f500]' : 'bg-red-400/15 text-red-400'
                          }`}>
                            {t.st === 'done' ? 'Thành công' : 'Đổi trả'}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>

          <footer className="border-t border-zinc-900 py-3 text-center text-[11px] text-zinc-500">
            © 2026 VibeFlow Sneakers • Thống Kê Bán Hàng Tại Quầy POS
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
